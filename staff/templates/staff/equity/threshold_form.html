{% extends 'core/base.html' %}
{% load crispy_forms_tags %}

{% block page_title %}Set Threshold Profit{% endblock %}

{% block content %}
<div class="container">
  <div class="ds-page-header">
    <h2 class="ds-page-header__title">Set Threshold Profit</h2>
  </div>
  <div class="ds-card">
    <div class="ds-card__body">
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'equity-threshold-list' %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
