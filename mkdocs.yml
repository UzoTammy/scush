site_name: Scush Documentation
site_description: Internal documentation for the Scush system
docs_dir: docs
site_dir: core/static/docs
use_directory_urls: false

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - search.suggest

nav:
  - Home: index.md
